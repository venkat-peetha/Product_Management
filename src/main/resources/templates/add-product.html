<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Product</title>
    <!-- ✅ Added Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
	<form action="/product/save" method="post" th:object="${product}" enctype="multipart/form-data">
	    <div class="container mt-5">
	        <div class="card shadow-lg rounded-4">
	            <div class="card-header bg-success text-white text-center">
	                <h2>Add New Product</h2>
	            </div>
	            <div class="card-body">

	                <div class="mb-3">
	                    <label class="form-label">Name:</label>
	                    <input type="text" th:field="*{name}" class="form-control" placeholder="Enter product name">
	                </div>

	                <div class="mb-3">
	                    <label class="form-label">Price:</label>
	                    <input type="number" th:field="*{price}" class="form-control" placeholder="Enter product price">
	                </div>

	                <div class="mb-3">
	                    <label class="form-label">Brand:</label>
	                    <input type="text" th:field="*{brand}" class="form-control" placeholder="Enter brand">
	                </div>

	                <div class="mb-3">
	                    <label class="form-label">Quantity:</label>
	                    <input type="number" th:field="*{quantity}" class="form-control" placeholder="Enter quantity">
	                </div>

	                <div class="mb-3">
	                    <label>Upload Image:</label>
	                    <input type="file" name="imageFile" accept="image/*" required>
	                </div>

	                <div class="text-center">
	                    <button type="submit" class="btn btn-success px-4">Save Product</button>
	                </div>

	            </div>
	        </div>
	    </div>
	</form>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Success</title>
    <!-- Bootstrap CSS -->
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" 
        rel="stylesheet">
</head>
<body class="bg-light text-center mt-5">

    <div th:if = "${SuccessMessage}">
		<h1 th:text="${SuccessMessage}" style = "color: green;"></h1>
	</div>
	
	<div th:if = "${ErrorMessage}">
			<h1 th:text="${ErrorMessage}" style = "color: Red;"></h1>
		</div>	

</body>
</html>
